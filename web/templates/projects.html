{{define "title"}}Projects · wakeview{{end}}

{{define "content"}}
<h1>Projects</h1>
{{- if not .}}
<p class="empty">No projects found.</p>
{{- else}}
<table class="list">
  <thead><tr><th>Project</th><th class="num">Sessions</th><th>Last active</th></tr></thead>
  <tbody>
  {{- range .}}
    <tr{{if .Missing}} class="missing"{{end}}>
      <td><a href="/p/{{.Dir}}">{{.Name}}</a>{{if .Missing}} <span class="badge">directory missing</span>{{end}}</td>
      <td class="num">{{len .Sessions}}</td>
      <td class="nowrap">{{fmtTime .Updated}}</td>
    </tr>
  {{- end}}
  </tbody>
</table>
{{- end}}
{{end}}
