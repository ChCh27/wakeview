{{define "title"}}{{.Summary.Title}} · wakeview{{end}}

{{define "crumbs"}}<span class="sep">/</span><a href="/p/{{.Project.Dir}}">{{.Project.Name}}</a>{{end}}

{{define "content"}}
<h1>{{.Summary.Title}}</h1>
<div class="session-meta">{{fmtTime .Summary.Started}} · {{.Summary.ID}}</div>
<form class="export" method="get">
  <span class="export-label">Export</span>
  <button type="submit" formaction="{{.Base}}/export.md">Markdown</button>
  <button type="submit" formaction="{{.Base}}/export.html">HTML</button>
  <label><input type="checkbox" name="noresults" value="1"> without tool results</label>
  <a class="delete-link" href="{{.Base}}/delete">Delete session</a>
</form>
{{template "stats" .Summary.Stats}}
<div id="log" data-events="{{.Events}}">{{template "entries" .Entries}}</div>
{{end}}
